<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; position: absolute; inset: 0; }
</style>
</head>
<body>
<canvas id="gnn"></canvas>
<script>
'use strict';
const canvas = document.getElementById('gnn');
const ctx    = canvas.getContext('2d', {alpha: true});
let W, H, cx, cy;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ── Helpers ──────────────────────────────────────────────────────────────
const ss = (a,b,x) => { const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); };
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

// ── 3-D Rotation & Projection ────────────────────────────────────────────
let angleY = 0.35, angleX = -0.22, t = 0;
function rotY(x,y,z,a){ return{x:x*Math.cos(a)+z*Math.sin(a),y,z:-x*Math.sin(a)+z*Math.cos(a)}; }
function rotX(x,y,z,a){ return{x,y:y*Math.cos(a)-z*Math.sin(a),z:y*Math.sin(a)+z*Math.cos(a)}; }
function project(px,py,pz){
  let r = rotY(px,py,pz,angleY); r = rotX(r.x,r.y,r.z,angleX);
  const fov = 2.6, s = fov/(fov+r.z), sc = Math.min(W,H)*0.33;
  return { x: cx+r.x*s*sc, y: cy+r.y*s*sc, z: r.z, s };
}

// ── GNN Nodes (resting positions, world −1..1) ───────────────────────────
const RN = [
  [-0.05,-0.50, 0.20],[0.42,-0.38, 0.02],[-0.50,-0.30,-0.10],
  [ 0.62,-0.10, 0.30],[-0.62,-0.12, 0.08],[0.22,-0.22, 0.52],
  [-0.22,-0.20, 0.42],[ 0.52, 0.28, 0.12],[-0.52, 0.30,-0.08],
  [ 0.10, 0.10,-0.32],[-0.10, 0.12,-0.42],[ 0.72, 0.12,-0.18],
  [-0.72, 0.20,-0.18],[ 0.32, 0.52, 0.22],[-0.32, 0.50, 0.10],
  [ 0.02, 0.62,-0.18],[ 0.40,-0.60,-0.08],[-0.40,-0.60,-0.18],
  [ 0.22,-0.28,-0.50],[-0.22,-0.28,-0.50],[ 0.60, 0.48,-0.28],
  [-0.60, 0.48,-0.20],[ 0.02, 0.04, 0.70],[ 0.80,-0.08, 0.10],
  [-0.80,-0.10, 0.02],[ 0.00,-0.05,-0.70],[ 0.35, 0.10, 0.08],
];

// Build edges from proximity
const edges = [];
const THRESH = 0.68;
for(let i=0;i<RN.length;i++)
  for(let j=i+1;j<RN.length;j++){
    const [ax,ay,az]=RN[i],[bx,by,bz]=RN[j];
    const d=Math.sqrt((ax-bx)**2+(ay-by)**2+(az-bz)**2);
    if(d<THRESH) edges.push([i,j,d]);
  }

// Precompute triangles
const eSet = new Set(edges.map(([i,j])=>`${Math.min(i,j)}_${Math.max(i,j)}`));
const hasE = (i,j) => eSet.has(`${Math.min(i,j)}_${Math.max(i,j)}`);
const tris = [];
for(let i=0;i<RN.length;i++)
  for(let j=i+1;j<RN.length;j++) if(hasE(i,j))
    for(let k=j+1;k<RN.length;k++) if(hasE(i,k)&&hasE(j,k)) tris.push([i,j,k]);

// ── Frequency Bands ───────────────────────────────────────────────────────
const BANDS = [
  {c:'#c400ff', yo:-0.66, amp:0.06, fr:0.9,  sp:0.60},
  {c:'#5522ff', yo:-0.52, amp:0.07, fr:1.2,  sp:0.70},
  {c:'#0066ff', yo:-0.38, amp:0.08, fr:1.5,  sp:0.80},
  {c:'#00aaff', yo:-0.24, amp:0.08, fr:1.9,  sp:0.90},
  {c:'#00ffcc', yo:-0.10, amp:0.09, fr:2.2,  sp:1.00},
  {c:'#39ff14', yo: 0.04, amp:0.08, fr:2.6,  sp:1.10},
  {c:'#aaff00', yo: 0.18, amp:0.07, fr:3.0,  sp:1.20},
  {c:'#ffaa00', yo: 0.32, amp:0.06, fr:3.4,  sp:1.30},
  {c:'#ff2200', yo: 0.46, amp:0.05, fr:3.8,  sp:1.40},
];

// ── Phase cycle (0→1 over 14 s) ──────────────────────────────────────────
// nodes:    always visible (appears at p=0)
// edges:    fade-in  0.10→0.22,  fade-out  0.90→0.99
// surfaces: fade-in  0.26→0.40,  fade-out  0.83→0.93
// volume:   fade-in  0.44→0.58,  fade-out  0.64→0.76
let p = 0;
const P_SPEED = 1 / (60 * 14);

// ── Frequency-driven node displacement ───────────────────────────────────
// Each band influences nodes at similar Y level; creates organic deformation
function displaced(idx) {
  const [bx, by, bz] = RN[idx];
  let dz = 0, dx = 0, dy = 0;
  BANDS.forEach((band, bi) => {
    const wy   = Math.exp(-((by - band.yo)**2) / 0.09); // gaussian y-proximity
    const e    = 0.5 + 0.5 * Math.sin(t * band.sp * 3.0 + bi * 0.6); // band energy 0..1
    const wave = Math.cos(band.fr * bx * Math.PI * 2.4 + t * band.sp * 1.5 + bi * 0.7);
    dz += wy * e * wave * 0.14;
    dx += wy * e * wave * 0.02 * band.fr * 0.3; // high-freq = more x jitter
    dy += wy * e * Math.sin(t * band.sp * 2 + bi) * 0.03; // slight vertical sway
  });
  return [bx + dx, by + dy, bz + dz];
}

// ── Hex to RGBA helper ────────────────────────────────────────────────────
function hexRgba(hex, alpha) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
}

// ── Main render loop ──────────────────────────────────────────────────────
function draw() {
  // Transparent clear (no background fill)
  ctx.clearRect(0, 0, W, H);

  // Band energies at current time
  const bandE = BANDS.map((band, bi) => 0.5 + 0.5 * Math.sin(t * band.sp * 3 + bi * 0.6));
  const totalE = bandE.reduce((s,e)=>s+e,0) / BANDS.length;

  // Dominant band color (brightest band drives the tint)
  let domBand = 0; let maxE = 0;
  bandE.forEach((e,i) => { if(e>maxE){ maxE=e; domBand=i; } });
  const domColor = BANDS[domBand].c;

  // Phase-driven layer alphas
  const nodeA    = ss(0.00, 0.05, p);
  const edgeA    = ss(0.10, 0.22, p) * (1 - ss(0.90, 0.99, p));
  const surfaceA = ss(0.26, 0.40, p) * (1 - ss(0.83, 0.93, p));
  const volumeA  = ss(0.44, 0.58, p) * (1 - ss(0.64, 0.76, p));

  // Stage label
  let stage = 'NODES';
  if      (volumeA  > 0.05) stage = 'VOLUME';
  else if (surfaceA > 0.05) stage = 'SURFACES';
  else if (edgeA    > 0.05) stage = 'EDGES';

  // Displaced node world positions
  const dispNodes = RN.map((_,i) => displaced(i));
  // Project to 2D
  const proj = dispNodes.map(([x,y,z]) => project(x,y,z));

  // ── Frequency bands ───────────────────────────────────────────────────
  BANDS.forEach((band, bi) => {
    const e = bandE[bi];
    const pts = [];
    for(let i=0;i<=80;i++){
      const xn = -1.4 + 2.8 * i / 80;
      const wave = band.amp * e * Math.sin(band.fr * Math.PI * xn * 2.8 + t * band.sp + bi * 0.65);
      const zn = -0.35 + xn * 0.28;
      pts.push(project(xn, band.yo + wave * 0.8, zn));
    }
    ctx.save();
    ctx.shadowColor = band.c; ctx.shadowBlur = 10 * e;
    ctx.globalAlpha = 0.55 + 0.35 * e;
    ctx.strokeStyle = band.c; ctx.lineWidth = 1.2 + e * 0.8;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.restore();
  });

  // ── VOLUME: glowing blob that pulses with frequencies ─────────────────
  if (volumeA > 0) {
    const sc = Math.min(W,H) * 0.34;
    const pulse = 0.38 + totalE * 0.16;
    const center = project(0, 0, 0);
    const grad = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, pulse * sc);
    grad.addColorStop(0,   hexRgba(domColor, volumeA * 0.22 * totalE));
    grad.addColorStop(0.35,hexRgba('#39ff14', volumeA * 0.12));
    grad.addColorStop(0.7, hexRgba('#39ff14', volumeA * 0.04));
    grad.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(center.x, center.y, pulse * sc, pulse * sc * 0.62, angleY * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Sort by depth
  const sortedTris = [...tris].sort((a,b) => {
    const za=(proj[a[0]].z+proj[a[1]].z+proj[a[2]].z)/3;
    const zb=(proj[b[0]].z+proj[b[1]].z+proj[b[2]].z)/3;
    return zb-za;
  });
  const sortedEdges = [...edges].sort((a,b) =>
    (proj[b[0]].z+proj[b[1]].z) - (proj[a[0]].z+proj[a[1]].z)
  );
  const sortedNodes = [...proj.map((q,i)=>({q,i}))].sort((a,b)=>b.q.z-a.q.z);

  // ── SURFACES: translucent triangular faces ────────────────────────────
  if (surfaceA > 0) {
    ctx.save();
    sortedTris.forEach(([i,j,k]) => {
      const pi=proj[i],pj=proj[j],pk=proj[k];
      // Tint face toward dominant frequency color
      const faceGlow = 0.08 + totalE * 0.08;
      ctx.globalAlpha = surfaceA * faceGlow * 1.6;
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 3;
      ctx.beginPath();
      ctx.moveTo(pi.x,pi.y); ctx.lineTo(pj.x,pj.y); ctx.lineTo(pk.x,pk.y);
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();
  }

  // ── EDGES: neon-green connecting lines ────────────────────────────────
  if (edgeA > 0) {
    ctx.save();
    ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 7;
    sortedEdges.forEach(([i,j,d]) => {
      const alpha = clamp((0.88 - d * 0.52) * edgeA, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 0.85;
      ctx.beginPath(); ctx.moveTo(proj[i].x,proj[i].y); ctx.lineTo(proj[j].x,proj[j].y); ctx.stroke();
    });
    ctx.restore();
  }

  // ── NODES: glowing dark-green spheres ────────────────────────────────
  sortedNodes.forEach(({q, i}) => {
    // Each node pulses with energy from nearby frequency bands
    const localE = bandE.reduce((s,e,bi) => {
      const wy = Math.exp(-((RN[i][1]-BANDS[bi].yo)**2) / 0.08);
      return s + e * wy;
    }, 0) / BANDS.length;
    const pulse = 1 + 0.18 * Math.sin(t * 1.6 + i * 0.85) + localE * 0.12;
    const r = (5.0 * q.s + 2) * pulse * nodeA;
    ctx.save();
    ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 16 + localE * 10;
    ctx.globalAlpha = nodeA * 0.94;
    // Outer ring
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI*2);
    ctx.fillStyle = '#0a280a'; ctx.fill();
    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 1; ctx.stroke();
    // Core
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(q.x, q.y, r * 0.38, 0, Math.PI*2);
    ctx.fillStyle = `rgba(30,${100+localE*80|0},30,1)`; ctx.fill();
    ctx.restore();
  });

  // ── Stage label ───────────────────────────────────────────────────────
  const fz = Math.max(8, Math.min(11, W/110)|0);
  ctx.save();
  ctx.font = `bold ${fz}px 'JetBrains Mono',monospace`;
  ctx.fillStyle = '#39ff14'; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 5;
  ctx.textAlign = 'left'; ctx.globalAlpha = 0.85;
  ctx.fillText(`GNN › ${stage}`, 8, H - 10);
  ctx.restore();

  // Advance
  angleY += 0.0034;
  t += 0.013;
  p = (p + P_SPEED) % 1;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
